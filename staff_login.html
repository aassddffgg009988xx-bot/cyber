{% extends "base.html" %}
{% block title %}دخول الموظفين{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card shadow-sm p-4">
      <h4 class="fw-bold mb-3 text-center">دخول الموظفين والإدارة</h4>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">اسم المستخدم</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">كلمة المرور</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">تسجيل الدخول</button>
      </form>
      <div class="mt-3 text-muted small">
        حساب المدير الافتراضي: <code>admin</code> / <code>Admin@123</code><br>
        حساب موظف: <code>staff1</code> / <code>Staff@123</code>
      </div>
    </div>
  </div>
</div>
{% endblock %}
