{% extends "base.html" %}
{% block title %}دخول الطالب{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card shadow-sm p-4">
      <h4 class="fw-bold mb-3 text-center">تسجيل دخول الطالب</h4>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">المعرف الفريد للبطاقة (Card UID)</label>
          <input type="text" name="card_uid" class="form-control" placeholder="مثال: CARD-1001" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">دخول إلى حسابي</button>
      </form>
      <div class="mt-3 text-muted small">تجربة سريعة: <code>CARD-1001</code></div>
    </div>
  </div>
</div>
{% endblock %}
